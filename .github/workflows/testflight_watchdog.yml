name: Keep TestFlight builds current

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: testflight-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore scheduling and request overdue builds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BRANCH: main
          BUILD_WORKFLOW: build_LoopFollow.yml
          UPSTREAM_REPO: loopandlearn/LoopFollow
        run: python3 .github/scripts/testflight_watchdog.py
